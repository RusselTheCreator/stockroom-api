version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockroom-postgres
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom_secret
      POSTGRES_DB: stockroom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
